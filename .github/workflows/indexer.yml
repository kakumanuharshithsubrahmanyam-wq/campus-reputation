name: Sepolia Indexer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
      START_BLOCK: ${{ secrets.START_BLOCK }}
      # FRONTEND_ORIGIN + JWT_SECRET must be set in repo secrets (JWT ≥16 chars). START_BLOCK optional.
      CHAIN_ID: "11155111"
      CAMP_TOKEN_ADDRESS: "0xF2c2bC22de5df5e95F5bB27b65E53b569E83d918"
      BADGE_CONTRACT_ADDRESS: "0x515677D8B9fe03998173032d7be9a0e7Ee78429c"
      CONFIRMATION_BLOCKS: "3"
      INDEXER_BLOCK_CHUNK: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Build backend
        run: npm run build
      - name: Run indexer once
        run: npm run indexer:once:prod
